services:
  postgres:
    image: postgres:17-alpine
    container_name: cache-postgres
    environment:
      POSTGRES_DB: cache
      POSTGRES_USER: cache
      POSTGRES_PASSWORD: cache
    ports:
      - "5432:5432"
    volumes:
      - cache-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cache -d cache"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cache-postgres-data:
