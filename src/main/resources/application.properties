spring.application.name=cache

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cache}
spring.datasource.username=${DB_USERNAME:cache}
spring.datasource.password=${DB_PASSWORD:cache}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
